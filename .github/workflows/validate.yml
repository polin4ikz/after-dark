name: Validate JavaScript

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
      - "compat/**"
      - "clean-rebuild"
  pull_request:
    branches:
      - main
      - "fix/**"

jobs:
  syntax:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate loaded scripts
        run: |
          node --check script.js
          node --check after-dark-final.js
          node --check auth-ui.js
          node --check supabase-runtime.js
          node --check supabase-ratings.js
          node --check api/tmdb.js
          node --check netlify/functions/tmdb.js
          node --check watch-player.js
          node --check api/archive-search.js
          node --check netlify/functions/archive-search.js
          node --check api/watch-sources.js
          node --check venom-watch-page.js
          node --test tests/watch-player.test.js tests/venom-player.test.js tests/archive-search.test.js tests/watch-sources.test.js tests/tmdb-proxy.test.js tests/movie-night-controls.test.js
