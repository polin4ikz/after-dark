name: Validate JavaScript

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  syntax:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate loaded scripts
        run: |
          node --check script.js
          node --check after-dark-final.js
          node --check auth-ui.js
          node --check supabase-runtime.js
          node --check supabase-ratings.js
