name: Venom player tests

on:
  pull_request:
    branches:
      - compat/current-player-client-tmdb
  push:
    branches:
      - fix/integrate-venom-into-watch-modal

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source validation tests
        run: node --test tests/venom-player.test.js
