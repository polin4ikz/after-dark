name: Venom player tests

on:
  pull_request:
    branches:
      - compat/current-player-client-tmdb
  push:
    branches:
      - fix/integrate-venom-into-watch-modal

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run source validation tests
        run: node --test tests/*.test.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/after-dark-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl --fail http://127.0.0.1:4173/player-lab.html >/dev/null && break
            sleep 1
          done
      - name: Smoke-test Shaka demo stream
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/player-lab.html', { waitUntil: 'domcontentloaded' });
            await page.getByRole('button', { name: 'ЗАГРУЗИТЬ ДЕМО SHAKA' }).click();
            await page.waitForFunction(() => {
              const status = document.querySelector('#status')?.textContent || '';
              return status.includes('ПОТОК ЗАГРУЖЕН') || status.includes('НЕ УДАЛОСЬ') || status.includes('ОШИБКА SHAKA') || status.includes('SHAKA НЕ ЗАГРУЗИЛАСЬ');
            }, { timeout: 60000 });
            const status = await page.locator('#status').innerText();
            const log = await page.locator('#log').innerText();
            console.log('Player lab status:', status);
            console.log('Diagnostics:', log);
            if (!status.includes('ПОТОК ЗАГРУЖЕН')) throw new Error('Shaka demo did not initialize: ' + status);
            if (errors.length) throw new Error('Browser errors: ' + errors.join('; '));
          } finally {
            await browser.close();
          }
          NODE
      - name: Verify real season and episode bounds in the main player
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.route('**/*', async route => {
              const url = new URL(route.request().url());
              if (url.pathname === '/api/tmdb') {
                const path = url.searchParams.get('path');
                if (path === '/tv/123') {
                  return route.fulfill({ contentType: 'application/json', body: JSON.stringify({
                    id: 123, seasons: [
                      { season_number: 1, episode_count: 2 },
                      { season_number: 2, episode_count: 1 },
                      { season_number: 99, episode_count: 0 }
                    ]
                  }) });
                }
                if (path === '/tv/123/season/1') {
                  return route.fulfill({ contentType: 'application/json', body: JSON.stringify({
                    season_number: 1, episodes: [
                      { episode_number: 1, name: 'Pilot' },
                      { episode_number: 2, name: 'The Second Episode' }
                    ]
                  }) });
                }
                if (path === '/tv/123/season/2') {
                  return route.fulfill({ contentType: 'application/json', body: JSON.stringify({
                    season_number: 2, episodes: [{ episode_number: 1, name: 'Finale' }]
                  }) });
                }
                return route.fulfill({ status: 400, contentType: 'application/json', body: JSON.stringify({ error: 'unexpected path', path }) });
              }
              if (url.origin === 'http://127.0.0.1:4173') return route.continue();
              return route.abort();
            });
            await page.addInitScript(() => {
              localStorage.setItem('after-dark:venom-current-film:v1', JSON.stringify({
                tmdbId: 123, type: 'series', media_type: 'tv', title: 'Test Series',
                first_air_date: '2020-01-01'
              }));
            });
            await page.goto('http://127.0.0.1:4173/venom-watch.html', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => {
              const select = document.querySelector('#seasonSelect');
              return select && !select.disabled && select.options.length === 2;
            }, { timeout: 10000 });
            const seasonOptions = await page.locator('#seasonSelect option').allTextContents();
            if (seasonOptions.some(option => option.includes('99 СЕЗОН'))) throw new Error('Season with zero episodes should not be selectable');
            await page.selectOption('#seasonSelect', '2');
            await page.waitForFunction(() => {
              const select = document.querySelector('#episodeSelect');
              return select && select.options.length === 1 && select.options[0].textContent.includes('Finale');
            }, { timeout: 10000 });
            const episodeOptions = await page.locator('#episodeSelect option').allTextContents();
            if (episodeOptions.length !== 1 || !episodeOptions[0].includes('Finale')) throw new Error('Episode list did not update to the selected season: ' + episodeOptions.join(', '));
            const appErrors = errors.filter(message => !message.includes("Failed to read the 'localStorage' property from 'Window': Access is denied for this document."));
            if (appErrors.length) throw new Error('Main player browser errors: ' + appErrors.join('; '));
            console.log('Season picker verified:', seasonOptions, '->', episodeOptions);
          } finally {
            await browser.close();
          }
          NODE
