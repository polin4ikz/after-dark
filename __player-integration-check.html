<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>After Dark player integration check</title></head><body><pre id="result">Инициализация…</pre>
<script src="/watch-player.js"></script><script src="/venom-player.js"></script>
<script>
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
window.addEventListener("load",async()=>{
 const out={};
 try{
  await wait(400);
  out.watchApi=typeof window.afterDarkWatchPlayer;
  if(!window.afterDarkWatchPlayer)throw new Error("watch player did not initialize");
  window.afterDarkWatchPlayer.open({title:"Во все тяжкие",name:"Во все тяжкие",tmdbId:1396,type:"series",first_air_date:"2008-01-20"});
  await wait(800);
  const modal=document.getElementById("adWatchPlayer");
  out.modal=Boolean(modal);
  out.venomForm=Boolean(modal?.querySelector(".ad-venom-panel"));
  const season=modal?.querySelector("[data-ad-season]");
  const episode=modal?.querySelector("[data-ad-episode]");
  const search=modal?.querySelector("[data-ad-neowatch-search]");
  const results=modal?.querySelector(".ad-watch-player__results");
  const status=modal?.querySelector(".ad-watch-player__status");
  if(!search||!results)throw new Error("source search UI missing");
  season.value="4";episode.value="2";
  search.click();
  const started=Date.now();
  while(Date.now()-started<22000){
   if(results.querySelector("[data-ad-neowatch-source]")||status?.classList.contains("is-error")||results.textContent.includes("НЕ ВЕРНУЛ"))break;
   await wait(300);
  }
  out.status=status?.textContent||"";
  out.resultText=results?.textContent||"";
  out.sources=[...(results?.querySelectorAll("[data-ad-neowatch-source]")||[])].map(b=>({label:b.dataset.provider,kind:b.dataset.sourceKind,https:String(b.dataset.adNeowatchSource||"").startsWith("https://")}));
 }catch(e){out.error=String(e)}
 document.getElementById("result").textContent=JSON.stringify(out,null,2);
});
</script></body></html>
