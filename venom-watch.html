<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e0d">
  <title>AFTER DARK — Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="venom-watch.css?v=20261027-track-controls1">
</head>
<body>
  <main class="player-page">
    <header class="player-header">
      <a class="wordmark" href="index.html#archive">AFTER <em>DARK</em></a>
      <span>PRIVATE CINEMA / PLAYER</span>
      <a class="back-link" href="index.html#archive">← В АРХИВ</a>
    </header>
    <section class="player-content">
      <div class="eyebrow">NOW PLAYING <span id="mediaType">PRIVATE SELECTION</span></div>
      <h1 id="mediaTitle">Загрузка…</h1>
      <p id="mediaMeta" class="media-meta"></p>
      <div id="playerStatus" class="player-status" role="status" aria-live="polite">Подготовка поиска…</div>
      <div id="playerStage" class="player-stage"><div class="player-placeholder">AFTER<br><em>DARK</em></div></div>
      <div class="player-actions" aria-label="Управление просмотром"><button type="button" data-player-action="restart">НАЧАТЬ СНАЧАЛА</button><button type="button" data-player-action="resume">ПРОДОЛЖИТЬ</button><button type="button" data-player-action="watched">ОТМЕТИТЬ ПРОСМОТРЕННЫМ</button></div>
      <section id="trackControls" class="track-controls" hidden aria-label="Настройки дорожек"><label>ОЗВУЧКА<select id="audioTrack" disabled><option value="-1">Источник не предоставляет выбор</option></select></label><label>СУБТИТРЫ<select id="subtitleTrack" disabled><option value="-1">Нет доступных дорожек</option></select></label></section>
      <p id="streamStatus" class="source-note stream-status" role="status" aria-live="polite">Озвучка, субтитры и качество настраиваются внутри самого плеера, если источник поддерживает эти функции.</p>
      <section class="source-discovery" aria-labelledby="sourceHeading">
        <div class="source-heading" id="sourceHeading">ИСТОЧНИКИ ПРОСМОТРА</div>
        <div id="sourceResults" class="source-results" aria-live="polite"></div>
      </section>
    </section>
    <footer class="player-footer"><span>AFTER DARK / EST. 2026</span><span>FILMS · SERIES · ANIMATION</span></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js"></script>
  <script src="https://cdn.dashjs.org/v4.7.4/dash.all.min.js"></script>
  <script src="watch-progress.js?v=20261026-progress3"></script>
  <script src="venom-watch-page.js?v=20261027-track-controls1"></script>
</body>
</html>
