<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>NeoWatch CDN check</title></head><body><pre id="result">Checking…</pre><script>
(async()=>{
 const out={};
 async function check(name,url){
  try{
   const r=await fetch(url,{mode:"cors",headers:{accept:"application/json"}});
   const p=await r.json(),d=p?.data||{};
   out[name]={status:r.status,success:p?.success,provider:d.provider,title:d.title,isSeries:d.isSeries,season:d.season,episode:d.episode,type:d.type,hasM3u8:Boolean(d.m3u8Url),urlProtocol:(()=>{try{return new URL(d.m3u8Url).protocol}catch(_){return ""}})()};
  }catch(e){out[name]={error:String(e)}}
 }
 await Promise.all([
  check("movie","https://api.neome.uk/api/v1/player/cdn/imdb/tt0137523"),
  check("series","https://api.neome.uk/api/v1/player/cdn/imdb/tt0903747?season=4&episode=2")
 ]);
 document.getElementById("result").textContent=JSON.stringify(out,null,2);
})();
</script></body></html>
