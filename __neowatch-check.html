<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>CDN audio tracks</title></head><body><video id="v" controls playsinline style="width:80vw"></video><pre id="result">Checking…</pre><script>
(async()=>{
 const out={};
 const write=()=>document.getElementById("result").textContent=JSON.stringify(out,null,2);
 try{
  const r=await fetch("https://api.neome.uk/api/v1/player/cdn/imdb/tt0137523",{mode:"cors",headers:{accept:"application/json"}});
  const p=await r.json(),url=p?.data?.m3u8Url;
  out.cdn={status:r.status,title:p?.data?.title,hasStream:Boolean(url)};
  const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/mattebox@0.15.0/dist/cdn/mattebox.min.js";
  await new Promise((ok,no)=>{script.onload=ok;script.onerror=no;document.head.appendChild(script)});
  const engine=window.mattebox.preset(),video=document.getElementById("v");
  const render=()=>{const all=engine.tracks?.available||[];out.tracks=all.map(t=>({name:t.name,lang:t.lang,type:t.contentType,channels:t.channels,selectable:engine.tracks.selectable(t.id)}));out.audio=out.tracks.filter(t=>t.type==="audio");write()};
  engine.on("tracks:changed",render);engine.on("tracks:selected",render);
  await engine.attach(video);engine.load(url);
  setTimeout(render,3500);
  setTimeout(()=>{out.video={readyState:video.readyState,duration:Number.isFinite(video.duration)?video.duration:null};write()},5000);
  write();
 }catch(e){out.error=String(e);write()}
})();
</script></body></html>
